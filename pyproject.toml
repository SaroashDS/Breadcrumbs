[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breadcrumbst"
version = "0.4.6"
description = "A terminal-first productivity timer that keeps your goals in view and helps you understand where you trail off."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["textual>=1.0,<2.0"]
keywords = ["pomodoro", "timer", "tui", "terminal", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/SaroashDS/Breadcrumbs"
Repository = "https://github.com/SaroashDS/Breadcrumbs"
Issues = "https://github.com/SaroashDS/Breadcrumbs/issues"
Changelog = "https://github.com/SaroashDS/Breadcrumbs/releases"

[project.optional-dependencies]
# Windows has no system IANA database; zoneinfo needs tzdata for the
# America/New_York DST fixtures. Linux/macOS resolve zones from the OS.
dev = ["pytest>=8.0", "tzdata; platform_system == 'Windows'"]

[project.scripts]
breadcrumbs = "breadcrumbs.__main__:main"
breadcrumbst = "breadcrumbs.__main__:main"
tlock = "breadcrumbs.__main__:legacy_main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["breadcrumbs"]

[tool.hatch.build.targets.sdist]
include = ["/breadcrumbs", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
